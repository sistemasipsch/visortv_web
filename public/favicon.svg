<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="brandBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0049EA" />
      <stop offset="100%" stop-color="#4CCAFA" />
    </linearGradient>
    <filter id="electricGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0049EA" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern rounded squircle (Larger to fill tab canvas) -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#brandBlueGrad)" filter="url(#electricGlow)" />
  
  <!-- Subtle inner border with sage tint -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="none" stroke="#BCD1CB" stroke-width="2" stroke-opacity="0.45" />

  <!-- TV Icon (Slightly smaller, airy and balanced like the sidebar logo) -->
  <g transform="translate(64, 64) scale(0.74) translate(-64, -64)">
    <!-- Antennas -->
    <polyline points="46 27 64 41 82 27" fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Screen Bezel -->
    <rect x="22" y="41" width="84" height="58" rx="15" fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- TV Stand Base -->
    <line x1="50" y1="107" x2="78" y2="107" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" />
    <line x1="64" y1="99" x2="64" y2="107" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

    <!-- Live Cyan Indicator Dot -->
    <circle cx="88" cy="55" r="5" fill="#4CCAFA" />
  </g>
</svg>